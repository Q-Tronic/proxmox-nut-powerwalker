# Przykład dla OFICJALNEJ integracji Home Assistant: Network UPS Tools (NUT)
# Sprawdź rzeczywiste entity_id po dodaniu integracji. Nazwy mogą się różnić.

- alias: "UPS NUT - praca na baterii"
  description: "Powiadomienie, gdy oficjalny sensor statusu NUT przejdzie na baterię."
  triggers:
    - trigger: state
      entity_id: sensor.ups_status
      to: "On Battery, Battery Discharging"
  actions:
    - action: persistent_notification.create
      data:
        title: "UPS: praca na baterii"
        message: "UPS utracił zasilanie sieciowe i pracuje z baterii."
  mode: single

- alias: "UPS NUT - niski poziom baterii"
  description: "Przykład progu użytkownika; nie steruje shutdownem Proxmoxa."
  triggers:
    - trigger: numeric_state
      entity_id: sensor.ups_battery_charge
      below: 25
  actions:
    - action: persistent_notification.create
      data:
        title: "UPS: niski poziom baterii"
        message: "Poziom baterii UPS spadł poniżej 25%."
  mode: single
